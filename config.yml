backend:
  name: github
  repo: brarsatinder0-hash/Heatherton-Cricket-Club
  branch: main
  base_url: https://curly-surf-114f.brarsatinder0.workers.dev

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "news"
    label: "Club News"
    description: "These cards show in the Latest from the Clubhouse section on the site."
    files:
      - name: "news"
        label: "News Items"
        file: "content/news.json"
        fields:
          - label: "News Items"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - {label: "Title", name: "title", widget: "string", hint: "Shown as the card headline"}
              - {label: "Tag (small label, e.g. a date or category)", name: "tag", widget: "string", required: false}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Link (optional — e.g. a PlayHQ URL)", name: "link", widget: "string", required: false}

  - name: "media"
    label: "Media / Photos"
    description: "These show as tiles in the Media section on the site."
    files:
      - name: "media"
        label: "Media Items"
        file: "content/media.json"
        fields:
          - label: "Media Items"
            name: "items"
            widget: "list"
            summary: "{{type}} — {{caption}}"
            fields:
              - {label: "Type", name: "type", widget: "select", options: ["Photo", "Video"]}
              - {label: "Image", name: "image", widget: "image", required: false, hint: "For videos, upload a thumbnail image"}
              - {label: "Caption", name: "caption", widget: "string", required: false}

  - name: "matches"
    label: "Match Results"
    description: "Enter basic stats after a match — the site automatically writes a match report and tracks player form from this."
    files:
      - name: "matches"
        label: "Match Entries"
        file: "content/matches.json"
        fields:
          - label: "Matches"
            name: "items"
            widget: "list"
            summary: "{{team}} vs {{opponent}} — {{result}}"
            fields:
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Our Team", name: "team", widget: "select", options: ["Saturday 1s", "Saturday 2s", "Sunday 1s", "Sunday 2s"]}
              - {label: "Opponent", name: "opponent", widget: "string"}
              - {label: "Result", name: "result", widget: "select", options: ["Won", "Lost", "Drawn", "Abandoned"]}
              - {label: "Venue", name: "venue", widget: "string", required: false}
              - label: "Player Performances"
                name: "performances"
                widget: "list"
                required: false
                summary: "{{name}} — {{runs}} runs, {{wickets}} wkts"
                fields:
                  - {label: "Player Name", name: "name", widget: "string"}
                  - {label: "Runs", name: "runs", widget: "number", value_type: "int", default: 0}
                  - {label: "Wickets", name: "wickets", widget: "number", value_type: "int", default: 0}
